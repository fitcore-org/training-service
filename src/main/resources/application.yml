spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth}
    username: ${DB_USER:fitcore}
    password: ${DB_PASS:fitcorepass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8082

minio:
  url: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123}
  bucket: fitcore-exercises
  external-url: ${MINIO_EXTERNAL_URL:http://localhost:9000}

# DeepL API Configuration
deepl:
  api:
    key: ${DEEPL_API_KEY:DEEPL_API_KEY}

# Translation Configuration
translation:
  enabled: ${TRANSLATION_ENABLED:false}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.fitcore: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
    prometheus:
      enabled: true