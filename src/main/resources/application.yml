spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/auth
    username: fitcore
    password: fitcorepass
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8082

minio:
  url: http://minio:9000
  access-key: minio
  secret-key: minio123
  bucket: fitcore-exercises
  external-url: http://localhost:9000

# DeepL API Configuration
deepl:
  api:
    key: ${DEEPL_API_KEY:DEEPL_API_KEY}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.fitcore: DEBUG
